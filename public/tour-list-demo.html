<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tours in India — pick one, see the total · World Compass Holidays</title>
  <meta name="description" content="A split list of tours. Choose one on the left and read the day, the total for your party, and the cancellation deadline on the right.">
  <meta name="theme-color" content="#f6f3ed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5e584f;
      --soft: #8a8175;
      --line: #e4ddd2;
      --paper: #f6f3ed;
      --card: #fffcf8;
      --blue: #3554d1;
      --blue-dark: #243ea8;
      --green: #0d6b52;
      --gold: #8a6420;
      --sand: #f3ecdf;
      --shadow: 0 18px 40px rgba(48, 36, 18, 0.12);
      --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
    }
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16.5px;
      line-height: 1.5;
      accent-color: var(--blue);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    img { max-width: 100%; display: block; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .skip { position: absolute; left: 12px; top: -40px; background: #fff; padding: 8px 12px; z-index: 80; border-radius: 8px; }
    .skip:focus { top: 12px; }

    .top { flex: none; background: rgba(246, 243, 237, 0.94); border-bottom: 1px solid var(--line); z-index: 5; }
    .header, .command, .rail, .chips { width: min(1280px, calc(100% - 28px)); margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo strong { font-family: var(--serif); font-size: 18px; font-weight: 560; display: block; line-height: 1; }
    .logo em { font-style: normal; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
    .header__nav, .header__actions { display: flex; align-items: center; gap: 8px; }
    .header__nav a { text-decoration: none; font-weight: 600; font-size: 14.5px; color: var(--muted); padding: 8px 12px; border-radius: 999px; }
    .header__nav a[aria-current="page"] { background: #fff; color: var(--ink); border: 1px solid var(--line); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 999px; border: 1px solid transparent; background: var(--blue); color: #fff;
      padding: 12px 18px; font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none;
    }
    .btn:hover { background: var(--blue-dark); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn--ghost { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn--ghost:hover { background: #fff; border-color: #cfc6b8; }
    .btn--small { padding: 9px 14px; font-size: 14.5px; }
    .btn--block { width: 100%; }
    .btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    .command { display: grid; grid-template-columns: minmax(0, 1.5fr) 170px 180px 190px; gap: 8px; padding-bottom: 8px; }
    .field { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 7px 12px 8px; min-width: 0; }
    .field label, .field .field__label { display: block; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--soft); font-weight: 700; }
    .field input, .field select, .who-btn {
      display: block; width: 100%; border: 0; background: transparent; padding: 2px 0 0;
      font-weight: 600; font-size: 15.5px; appearance: none; -webkit-appearance: none;
    }
    .field input:focus, .field select:focus, .who-btn:focus { outline: none; }
    .field:focus-within { box-shadow: inset 0 0 0 2px var(--blue); }
    .who-btn { text-align: left; }

    .rail { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .pill {
      border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px;
      font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    .pill[aria-pressed="true"], .pill.is-set { background: var(--ink); color: #fff; border-color: var(--ink); }
    .pill .n { color: var(--soft); font-weight: 600; margin-left: 4px; }
    .pill[aria-pressed="true"] .n, .pill.is-set .n { color: #ddd; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 10px; }
    .chips:empty { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 13.5px; font-weight: 600; }
    .chip button, .linkish { border: 0; background: transparent; color: var(--blue); font-weight: 600; padding: 0; }
    .chip button { color: var(--muted); font-size: 16px; line-height: 1; }

    .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); }
    .index, .stage { min-height: 0; overflow: auto; }
    .index { border-right: 1px solid var(--line); background: #f3efe8; }
    .index__head { position: sticky; top: 0; z-index: 2; background: #f3efe8; padding: 14px 16px 10px; border-bottom: 1px solid transparent; }
    .index__head h1 { font-family: var(--serif); font-weight: 560; font-size: 26px; letter-spacing: -0.03em; line-height: 1.1; }
    .why, .note { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
    .note { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .note[hidden] { display: none; }
    .rows { display: flex; flex-direction: column; }
    .row {
      display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: center;
      width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; padding: 12px 14px; color: inherit;
    }
    .row:hover { background: rgba(255,252,248,0.7); }
    .row.is-on { background: var(--card); box-shadow: inset 3px 0 0 var(--blue); }
    .row.is-off { opacity: 0.72; }
    .row img { width: 74px; height: 74px; object-fit: cover; border-radius: 12px; background: #e7e0d6; }
    .row strong { display: block; font-family: var(--serif); font-weight: 560; font-size: 17px; letter-spacing: -0.02em; line-height: 1.2; }
    .row__meta { display: block; color: var(--muted); font-size: 13.5px; margin-top: 3px; }
    .row__flag { display: block; color: var(--gold); font-size: 12.5px; font-weight: 600; margin-top: 3px; }
    .row__side { text-align: right; }
    .row__price { font-family: var(--serif); font-size: 20px; letter-spacing: -0.03em; display: block; }
    .row__score { color: var(--green); font-weight: 700; font-size: 13px; }
    .row__tools { display: flex; gap: 4px; justify-content: flex-end; margin-top: 6px; }
    .icon-btn {
      border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 8px; font-size: 12.5px; font-weight: 600;
    }
    .icon-btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .empty { padding: 18px 16px 28px; }
    .empty h2 { font-family: var(--serif); font-weight: 560; font-size: 28px; letter-spacing: -0.03em; }
    .empty p { color: var(--muted); margin: 8px 0 14px; }
    .empty__actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .stage { background: var(--card); }
    .stage__back { display: none; margin: 12px 16px 0; }
    .hero { width: 100%; height: min(42vh, 440px); object-fit: cover; background: #e7e0d6; }
    .stage__pad { width: min(780px, calc(100% - 48px)); margin: 0 auto; padding: 22px 0 40px; }
    .kicker { color: var(--muted); font-size: 14px; }
    .stage h2 { font-family: var(--serif); font-weight: 560; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.035em; line-height: 1.02; margin: 4px 0 8px; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .facts span { background: var(--sand); border-radius: 999px; padding: 6px 10px; font-size: 13.5px; font-weight: 600; }
    .lede { font-size: 17.5px; max-width: 62ch; }
    .mention { color: var(--muted); margin-top: 8px; }
    .cancel { margin-top: 8px; font-size: 15px; }
    .cancel--yes { color: var(--green); font-weight: 600; }
    .cancel--no, .cancel--closed { color: var(--muted); }
    .split-copy { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
    .split-copy h3 { font-size: 15px; margin-bottom: 6px; }
    .split-copy ul, .timeline { margin: 0; padding-left: 18px; }
    .split-copy li, .timeline li { margin: 4px 0; }
    .bill {
      margin-top: 20px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-end;
      background: var(--paper); border-radius: 18px; padding: 16px 18px;
    }
    .bill__total { font-family: var(--serif); font-size: 40px; letter-spacing: -0.03em; line-height: 1; }
    .bill__sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .stage__actions { display: flex; gap: 8px; margin-top: 14px; }
    .form { display: grid; gap: 10px; margin-top: 16px; }
    .form label { font-size: 13.5px; font-weight: 600; }
    .form input, .form textarea { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
    .err { color: #9f1239; font-size: 14px; min-height: 1.2em; }
    .success { background: #e7f4ee; border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
    .flag { background: var(--sand); color: #6b5424; border-radius: 10px; padding: 8px 10px; font-size: 14px; font-weight: 600; margin-top: 10px; }
    .fine { color: var(--soft); font-size: 13px; margin-top: 22px; }
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
    thead th { font-family: var(--serif); font-size: 18px; font-weight: 560; }
    tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.best { background: #e7f4ee; }

    .pop {
      position: fixed; z-index: 40; width: min(340px, calc(100vw - 24px));
      background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
      padding: 12px 14px; max-height: min(440px, 70vh); overflow: auto;
    }
    .pop[hidden] { display: none; }
    .check { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 15px; }
    .check input { width: 16px; height: 16px; margin: 0; }
    .check .count { margin-left: auto; color: var(--soft); font-variant-numeric: tabular-nums; font-size: 13px; }
    .check.is-zero { color: var(--soft); }
    .step { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .step + .step { border-top: 1px solid #f0ebe3; }
    .step b { min-width: 1.2em; text-align: center; display: inline-block; }
    .step__btns { display: flex; align-items: center; gap: 8px; }
    .step__btns button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; }
    .step__btns button:disabled { opacity: 0.35; }
    .hint { color: var(--muted); font-size: 13.5px; }
    .slider { position: relative; height: 32px; margin: 8px 4px; }
    .slider__track, .slider__fill { position: absolute; top: 14px; height: 4px; border-radius: 99px; }
    .slider__track { left: 0; right: 0; background: #e4ddd2; }
    .slider__fill { background: var(--blue); }
    .slider input[type="range"] { position: absolute; left: 0; width: 100%; top: 4px; margin: 0; height: 24px; background: none; pointer-events: none; appearance: none; }
    .slider input::-webkit-slider-thumb { pointer-events: auto; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); cursor: grab; }
    .slider input::-moz-range-thumb { pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); cursor: grab; }
    .price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .price-row label { font-size: 12px; color: var(--soft); font-weight: 600; }
    .price-row input { display: block; width: 100%; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-weight: 600; }
    #toast {
      position: fixed; z-index: 70; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
      background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 14px; font-size: 14.5px;
      opacity: 0; pointer-events: none;
    }
    #toast.on { opacity: 1; transform: translateX(-50%); }

    @media (max-width: 860px) {
      body { height: auto; min-height: 100%; overflow: auto; }
      .split { display: block; }
      .index, .stage { overflow: visible; }
      .stage { display: none; }
      body.stage-open .index { display: none; }
      body.stage-open .stage { display: block; }
      .stage__back { display: inline-flex; }
      .command, .split-copy, .bill { grid-template-columns: 1fr; display: grid; }
      .bill { align-items: start; }
      .header__nav { display: none; }
      .hero { height: 220px; }
      .stage__pad { width: min(780px, calc(100% - 28px)); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>

  <a class="skip" href="#rows">Skip to the list</a>
  <div class="top">
    <header class="header">
      <a class="logo" href="tour-list-demo.html" aria-label="World Compass Holidays">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13.2" fill="none" stroke="#3554d1" stroke-width="1.6"/>

    <form class="command" id="command">

      <div class="field">

          <option value="match">Best match</option>
          <option value="price">Lowest total</option>

          <option value="reviews">Most reviews</option>
          <option value="short">Shortest</option>
          <option value="long">Longest</option>

    <div class="rail" id="rail" role="toolbar" aria-label="Filters"></div>
    <div class="chips" id="chips" aria-label="Active filters"></div>

  <div class="split">
    <section class="index" id="index" aria-label="Tour list">
      <div class="index__head">
        <h1 id="count">Tours</h1>
        <p class="why" id="why"></p>
        <p class="note" id="note" hidden></p>
      </div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty" hidden>
        <h2>Nothing matches</h2>
        <p id="empty-copy"></p>
        <div class="empty__actions" id="empty-actions"></div>
      </div>
    </section>
    <section class="stage" id="stage" aria-live="polite"></section>
  </div>

  <div class="pop" id="pop" hidden></div>
  <div id="toast" role="status"></div>
  <p class="sr" id="live" aria-live="polite"></p>

      const children = Number(p.get("children"));
      if (adults >= 1 && adults <= 8) state.adults = adults;
      if (children >= 0 && children <= 6) state.children = children;
      if (p.has("min") && Number.isFinite(Number(p.get("min")))) state.min = Number(p.get("min"));
      if (p.has("max") && Number.isFinite(Number(p.get("max")))) state.max = Number(p.get("max"));
      const take = (key, set, allowed) => (p.get(key) || "").split(",").filter((v) => allowed.has(v)).forEach((v) => set.add(v));
      take("dur", state.dur, new Set(DURS.map((d) => d[0])));
      take("region", state.region, new Set(TOURS.map((t) => t.region)));
      take("cat", state.cat, new Set(TOURS.map((t) => t.category)));
      take("when", state.when, new Set(WHENS.map((d) => d[0])));
      take("style", state.style, new Set(STYLES.map((d) => d[0])));
      take("lang", state.lang, new Set(LANGS.map((d) => d[0])));
      state.cancel = p.get("cancel") === "1";
      state.pickup = p.get("pickup") === "1";
      if (Number(p.get("rating")) === 8 || Number(p.get("rating")) === 9) state.rating = Number(p.get("rating"));
      if (["match", "price", "rating", "reviews", "short", "long"].includes(p.get("sort"))) state.sort = p.get("sort");
      state.showOff = p.get("off") === "1";
      state.showSold = p.get("sold") === "1";
      state.savedOnly = p.get("saved") === "1";
      state.compare = (p.get("cmp") || "").split(",").filter((id) => tourById(id)).slice(0, 3);
      if (tourById(p.get("sel"))) state.selected = p.get("sel");
      if (p.get("view") === "compare") state.stageMode = "compare";
      try {
        const raw = JSON.parse(localStorage.getItem("wch-tours-saved") || "[]");
        if (Array.isArray(raw)) raw.forEach((id) => { if (tourById(id)) state.saved.add(id); });

      if (state.max != null) p.set("max", String(state.max));
      const put = (key, set) => { if (set.size) p.set(key, [...set].join(",")); };

      put("when", state.when); put("style", state.style); put("lang", state.lang);

      if (state.cat.size) attempt("Clear type", () => state.cat.clear());
      if (state.dur.size) attempt("Clear duration", () => state.dur.clear());
      if (state.when.size) attempt("Clear start time", () => state.when.clear());
      if (state.style.size) attempt("Clear group", () => state.style.clear());
      if (state.lang.size) attempt("Clear language", () => state.lang.clear());
      if (state.cancel) attempt("Allow non-refundable", () => { state.cancel = false; });
      if (state.pickup) attempt("Include no pickup", () => { state.pickup = false; });
      if (state.rating) attempt("Any score", () => { state.rating = 0; });

        const actions = [];
        if (off && !state.showOff) actions.push(`<button class="linkish" type="button" data-clear="show-off">Show other dates</button>`);
        if (sold && !state.showSold) actions.push(`<button class="linkish" type="button" data-clear="show-sold">Show sold out</button>`);
        $("note").innerHTML = `<span>${esc(bits.join(". ") + " on " + pretty(state.date) + ".")}</span>` + actions.join("");
      } else { $("note").hidden = true; $("note").innerHTML = ""; }
      $("rows").innerHTML = rows.map(rowHtml).join("");
      $("empty").hidden = rows.length > 0;
      if (!rows.length) {
        const ideas = suggestions();
        $("empty-copy").textContent = "The date and the party stay. Loosen one filter.";
        $("empty-actions").innerHTML = ideas.map((idea, i) => `<button class="btn ${i ? "btn--ghost" : ""} btn--small" type="button" data-relax="${i}">${esc(idea.label)}</button>`).join("") + `<button class="btn btn--ghost btn--small" type="button" data-clear="all">Clear filters</button>`;
        $("empty-actions")._ideas = ideas;
      }
      const selected = tourById(state.selected);
      const mode = state.stageMode;
      $("stage").dataset.mode = mode;
      $("stage").dataset.id = state.selected;
      $("stage").innerHTML = mode === "compare" ? stageCompare() : (selected ? stageTour(selected) : `<div class="stage__pad"><h2>No tour in this list</h2></div>`);
      if (mode !== prevMode || state.selected !== prevId) $("stage").scrollTop = 0;
      $("index").scrollTop = indexScroll;
      $("rail").innerHTML = railHtml();
      $("chips").innerHTML = chipsHtml();
      if (document.activeElement !== $("q")) $("q").value = state.q;
      $("date").value = state.date;
      $("date").min = todayIso();
      if ($("sort").value !== state.sort) $("sort").value = state.sort;
      $("who-btn").textContent = whoLabel();
      $("who-btn").setAttribute("aria-expanded", String(state.menu === "who"));
      $("saved-toggle").setAttribute("aria-pressed", String(state.savedOnly));
      $("saved-toggle").textContent = "Saved" + (state.saved.size ? " · " + state.saved.size : "");
      const cmp = $("compare-open");
      cmp.hidden = state.compare.length < 2;
      cmp.textContent = "Compare " + state.compare.length;
      cmp.setAttribute("aria-pressed", String(state.stageMode === "compare"));
      const pop = $("pop");
      if (!state.menu) pop.hidden = true;
      else {
        const focus = document.activeElement;
        const keepSlider = state.menu === "price" && focus && (focus.id === "rmin" || focus.id === "rmax");
        if (!keepSlider) pop.innerHTML = menuHtml();
        pop.hidden = false;
        const anchor = document.querySelector(`[data-menu="${state.menu}"], #who-btn`);
        if (anchor) {
          const r = anchor.getBoundingClientRect();
          pop.style.top = Math.min(r.bottom + 8, window.innerHeight - 80) + "px";
          pop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - pop.offsetWidth - 12)) + "px";
        }
      }
      document.body.classList.toggle("stage-open", narrow() && Boolean(state.selected) && state._opened);
      if (booted) $("live").textContent = $("count").textContent + ". " + (selected ? selected.title : "");
      booted = true;
    }
    function selectTour(id, open) {
      state.selected = id;
      state.stageMode = "tour";
      if (open) state._opened = true;
      render();
      const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
      if (row) row.focus();
    }
    function toggleCompare(id) {
      const at = state.compare.indexOf(id);
      if (at >= 0) state.compare.splice(at, 1);
      else if (state.compare.length >= 3) { toast("Pin up to 3 tours."); return; }
      else state.compare.push(id);
      if (state.compare.length < 2) state.stageMode = "tour";
      render();
    }
    function toggleSave(id) {
      if (state.saved.has(id)) state.saved.delete(id);
      else state.saved.add(id);
      persistSaved();
      render();
    }
    function applyQuick(id) {
      const on = { day: sameSet(state.dur, ["half", "day"]), multi: sameSet(state.dur, ["2", "mid", "long"]), cancel: state.cancel, pickup: state.pickup, nine: state.rating === 9 }[id];
      if (id === "day") state.dur = on ? new Set() : new Set(["half", "day"]);
      if (id === "multi") state.dur = on ? new Set() : new Set(["2", "mid", "long"]);
      if (id === "cancel") state.cancel = !state.cancel;
      if (id === "pickup") state.pickup = !state.pickup;
      if (id === "nine") state.rating = on ? 0 : 9;
      render();
    }
    function applyClear(key) {
      if (key === "all") clearFilters();
      else if (key === "q") state.q = "";
      else if (key === "price") { state.min = null; state.max = null; }
      else if (key === "cancel") state.cancel = false;
      else if (key === "pickup") state.pickup = false;
      else if (key === "rating") state.rating = 0;
      else if (key === "saved") state.savedOnly = false;
      else if (key === "off") state.showOff = false;
      else if (key === "sold") state.showSold = false;
      else if (key === "show-off") state.showOff = true;
      else if (key === "show-sold") state.showSold = true;
      else { const [kind, value] = key.split(":"); state[kind].delete(value); }
      render();
    }
    function setPriceFromSlider() {
      const [lo, hi] = bounds();
      let min = Number($("rmin").value);
      let max = Number($("rmax").value);
      if (min > max) { if (document.activeElement === $("rmin")) min = max; else max = min; }
      state.min = min <= lo ? null : min;
      state.max = max >= hi ? null : max;
      render();
    }

    $("index").addEventListener("scroll", () => { indexScroll = $("index").scrollTop; });
    $("rows").addEventListener("click", (e) => {
      const row = e.target.closest("[data-id]");
      if (!row) return;
      if (e.target.closest("[data-pin]")) { toggleCompare(row.dataset.id); return; }
      if (e.target.closest("[data-save]")) { toggleSave(row.dataset.id); return; }
      state._opened = true;
      selectTour(row.dataset.id, true);
    });
    $("rows").addEventListener("keydown", (e) => {
      const row = e.target.closest(".row");
      if (!row) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state._opened = true; selectTour(row.dataset.id, true); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const all = [...document.querySelectorAll(".row")];
        const i = all.indexOf(row);
        const next = all[i + (e.key === "ArrowDown" ? 1 : -1)];
        if (next) { state._opened = !narrow(); selectTour(next.dataset.id, !narrow()); }
      }
    });
    $("stage").addEventListener("click", (e) => {
      if (e.target.closest("[data-back]")) { state._opened = false; document.body.classList.remove("stage-open"); return; }
      const pin = e.target.closest("[data-pin]");
      if (pin) { toggleCompare(pin.dataset.id || state.selected); return; }
      const save = e.target.closest("[data-save]");
      if (save) { toggleSave(save.dataset.id || state.selected); return; }
      const open = e.target.closest("[data-open]");
      if (open) { state._opened = true; selectTour(open.dataset.open, true); }
    });
    $("stage").addEventListener("submit", (e) => {
      const form = e.target.closest("form");
      if (!form) return;
      e.preventDefault();
      const err = form.querySelector("[data-err]");
      const name = form.name.value.trim();
      const phone = form.phone.value.replace(/[\s-]/g, "");
      if (name.length < 2) { err.textContent = "Add the name we should ask for."; form.name.focus(); return; }
      if (!/^[0-9+]{8,15}$/.test(phone)) { err.textContent = "Add a phone number with at least 8 digits."; form.phone.focus(); return; }
      const t = tourById(form.dataset.request);
      form.replaceWith(Object.assign(document.createElement("div"), {
        className: "success",
        innerHTML: `<strong>Noted on this page only.</strong><p style="margin-top:6px">${esc(name)}, a real request for ${esc(t.title)} would come back with the meeting time before you pay. The total was ${esc(inr(partyTotal(t)))}.</p>`
      }));
    });
    $("rail").addEventListener("click", (e) => {
      const menu = e.target.closest("[data-menu]");
      const quick = e.target.closest("[data-quick]");
      if (menu) { state.menu = state.menu === menu.dataset.menu ? null : menu.dataset.menu; render(); }
      if (quick) applyQuick(quick.dataset.quick);
    });
    $("who-btn").addEventListener("click", () => { state.menu = state.menu === "who" ? null : "who"; render(); });
    $("pop").addEventListener("change", (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.kind) return;
      if (el.checked) state[el.dataset.kind].add(el.value);
      else state[el.dataset.kind].delete(el.value);
      render();
    });
    $("pop").addEventListener("input", (e) => { if (e.target.id === "rmin" || e.target.id === "rmax") setPriceFromSlider(); });
    $("pop").addEventListener("change", (e) => {
      if (e.target.id !== "nmin" && e.target.id !== "nmax") return;
      const [lo, hi] = bounds();
      const raw = Number(String(e.target.value).replace(/[^\d]/g, ""));
      if (!Number.isFinite(raw)) { render(); return; }
      const value = Math.min(hi, Math.max(lo, raw));
      if (e.target.id === "nmin") state.min = value <= lo ? null : value;
      else state.max = value >= hi ? null : value;
      if (state.min != null && state.max != null && state.min > state.max) {
        if (e.target.id === "nmin") state.max = state.min;
        else state.min = state.max;
      }
      render();
    });
    $("pop").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-step]");
      if (!btn) return;
      const key = btn.dataset.step;
      const next = state[key] + Number(btn.dataset.dir);
      if (key === "adults" && next >= 1 && next <= 8) state.adults = next;
      if (key === "children" && next >= 0 && next <= 6) state.children = next;
      render();
    });
    document.addEventListener("click", (e) => {
      const path = e.composedPath();
      const inside = path.some((node) => node === $("pop") || node === $("who-btn") || (node.matches && node.matches("[data-menu]")));
      if (inside) return;
      if (state.menu) { state.menu = null; render(); }
      const clear = e.target.closest("[data-clear]");
      if (clear) applyClear(clear.dataset.clear);
      const relax = e.target.closest("[data-relax]");
      if (relax && $("empty-actions")._ideas) {
        const idea = $("empty-actions")._ideas[Number(relax.dataset.relax)];
        if (idea) { idea.apply(); render(); }
      }
    });
    $("q").addEventListener("input", () => { state.q = $("q").value; render(); });
    $("date").addEventListener("change", () => {
      if (!$("date").value || $("date").value < todayIso()) $("date").value = state.date;
      else { state.date = $("date").value; render(); }
    });
    $("sort").addEventListener("change", () => { state.sort = $("sort").value; render(); });
    $("command").addEventListener("submit", (e) => e.preventDefault());
    $("saved-toggle").addEventListener("click", () => { state.savedOnly = !state.savedOnly; render(); });
    $("compare-open").addEventListener("click", () => {
      state.stageMode = state.stageMode === "compare" ? "tour" : "compare";
      state._opened = true;
      render();
    });
    $("share").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); toast("Link copied. It keeps the date, party, filters, and the open tour."); }
      catch (err) { toast("Copy the address from the browser bar."); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.menu) { state.menu = null; render(); }
      if (e.key === "Escape" && narrow() && state._opened) { state._opened = false; document.body.classList.remove("stage-open"); }
    });
    window.addEventListener("resize", () => {
      if (!narrow()) state._opened = false;
      render();
    });

    readUrl();
    state._opened = false;
    render();
  </script>
</body>
</html>
